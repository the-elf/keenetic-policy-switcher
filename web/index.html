<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keenetic — Policy Switcher</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Device type icons: inline sprite, no CDN or external files (spec §8). -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-device" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="12" rx="2"/>
      <path d="M8 20h8"/>
    </symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24">
      <rect x="7" y="2" width="10" height="20" rx="2"/>
      <path d="M11 18h2"/>
    </symbol>
    <symbol id="icon-laptop" viewBox="0 0 24 24">
      <rect x="4" y="5" width="16" height="10" rx="1"/>
      <path d="M2 19h20"/>
    </symbol>
    <symbol id="icon-tv" viewBox="0 0 24 24">
      <rect x="2" y="6" width="20" height="12" rx="2"/>
      <path d="M8 3l4 3 4-3"/>
    </symbol>
  </svg>

  <header class="topbar">
    <h1>Devices</h1>
    <button id="refresh-btn" class="icon-btn" title="Refresh" aria-label="Refresh device list">↻</button>
  </header>

  <div id="offline-banner" class="banner banner--error" hidden>
    Router is offline. Showing the last known data.
  </div>

  <main id="device-list" class="device-list" aria-live="polite">
    <p id="loading" class="hint">Loading…</p>
  </main>

  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <template id="device-card-template">
    <article class="device-card">
      <button type="button" class="device-card__favorite" aria-pressed="false" aria-label="Toggle favorite">★</button>
      <div class="device-card__status" aria-hidden="true"></div>
      <svg class="device-card__icon" aria-hidden="true" focusable="false"><use href="#icon-device"></use></svg>
      <div class="device-card__info">
        <div class="device-card__name"></div>
        <div class="device-card__meta"></div>
      </div>
      <select class="device-card__policy"></select>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
